name: 'Azure Boards, check for AB#'
description: 'Check if the pull request description contains a markdown link to an Azure Boards work item'
author: 'danhellem'
branding:
  icon: "code"
  color: "purple"
inputs:
  repo-token:
    description: 'GitHub token for reading the current pull request'
    default: ${{ github.token }}
    required: false
runs:
  using: 'composite'
  steps:
    - shell: pwsh
      run: |
        & "${{ github.action_path }}/action.ps1" -RepoToken "${{ inputs.repo-token }}"
